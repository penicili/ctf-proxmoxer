---
# remove_port_forward.yml
# Cleanup iptables DNAT rules di PVE host saat terminate challenge
#
# Required extra_vars:
#   vm_ip:          IP internal VM (e.g. 10.10.10.201)
#   ssh_port:       Port SSH publik (e.g. 22201)
#   http_port:      Port HTTP publik (e.g. 80201)
#   pve_public_ip:  IP publik PVE host (e.g. 192.168.1.102)

- name: Remove port forwarding for challenge VM
  hosts: all
  become: true
  gather_facts: false

  tasks:
    - name: Remove SSH DNAT rule
      ansible.builtin.iptables:
        table: nat
        chain: PREROUTING
        protocol: tcp
        destination: "{{ pve_public_ip }}"
        destination_port: "{{ ssh_port }}"
        jump: DNAT
        to_destination: "{{ vm_ip }}:22"
        comment: "ctf-forward-ssh-{{ vm_ip }}"
        state: absent

    - name: Remove HTTP DNAT rule
      ansible.builtin.iptables:
        table: nat
        chain: PREROUTING
        protocol: tcp
        destination: "{{ pve_public_ip }}"
        destination_port: "{{ http_port }}"
        jump: DNAT
        to_destination: "{{ vm_ip }}:80"
        comment: "ctf-forward-http-{{ vm_ip }}"
        state: absent

    - name: Remove FORWARD rule for SSH
      ansible.builtin.iptables:
        chain: FORWARD
        protocol: tcp
        destination: "{{ vm_ip }}"
        destination_port: "22"
        jump: ACCEPT
        comment: "ctf-allow-ssh-{{ vm_ip }}"
        state: absent

    - name: Remove FORWARD rule for HTTP
      ansible.builtin.iptables:
        chain: FORWARD
        protocol: tcp
        destination: "{{ vm_ip }}"
        destination_port: "80"
        jump: ACCEPT
        comment: "ctf-allow-http-{{ vm_ip }}"
        state: absent

    - name: Remove MASQUERADE rule
      ansible.builtin.iptables:
        table: nat
        chain: POSTROUTING
        source: "{{ vm_ip }}"
        jump: MASQUERADE
        comment: "ctf-masq-{{ vm_ip }}"
        state: absent
