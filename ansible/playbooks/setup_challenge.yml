---
# setup_challenge.yml
# Setup challenge di VM — untuk saat ini hanya test koneksi
# TODO: tambah logika clone repo + flag injection

- name: Setup challenge VM
  hosts: all
  become: true
  gather_facts: true

  tasks:
    - name: Verify VM connectivity
      ansible.builtin.ping:

    - name: Show VM info
      ansible.builtin.debug:
        msg: "VM ready — challenge_id={{ challenge_id }}, team={{ team }}, vmid={{ vmid }}"