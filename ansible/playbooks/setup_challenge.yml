---
# setup_challenge.yml
# Clone repo untuk mendapatkan docker-compose.yml, tulis .env, lalu docker compose up.
#
# Required extra_vars:
#   challenge_id:  int
#   flag:          str
#   team:          str
#   vmid:          int
#   image_tag:     str  — nama image di registry (e.g. "level-1")
#   registry_host: str  — host:port registry (e.g. "10.10.10.5:5000")
#   source_url:    str  — git repo URL challenge (untuk docker-compose.yml)

- name: Setup CTF challenge on VM
  hosts: all
  become: true
  gather_facts: false

  environment:
    PATH: "/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin:/snap/bin"

  vars:
    challenge_dir: "/opt/challenge/{{ image_tag }}"

  tasks:
    - name: Ensure challenge directory is clean
      ansible.builtin.file:
        path: "{{ challenge_dir }}"
        state: absent

    - name: Clone challenge repo
      ansible.builtin.git:
        repo:  "{{ source_url }}"
        dest:  "{{ challenge_dir }}"
        depth: 1
        force: yes

    - name: Write .env file
      ansible.builtin.copy:
        dest: "{{ challenge_dir }}/.env"
        content: |
          FLAG={{ flag }}
          REGISTRY_HOST={{ registry_host }}
          IMAGE_TAG={{ image_tag }}

    - name: Pull images and start services
      ansible.builtin.command:
        cmd:   "docker compose up -d --pull always"
        chdir: "{{ challenge_dir }}"

    - name: Wait for service on port 80
      ansible.builtin.wait_for:
        host:    127.0.0.1
        port:    80
        delay:   2
        timeout: 60

    - name: Show challenge info
      ansible.builtin.debug:
        msg: "Challenge {{ challenge_id }} ready — team={{ team }}, image={{ registry_host }}/{{ image_tag }}:latest"
