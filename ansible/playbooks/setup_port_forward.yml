---
# setup_port_forward.yml
# Setup iptables DNAT rules di PVE host untuk forward traffic ke VM internal IP
#
# Required extra_vars:
#   vm_ip:          IP internal VM (e.g. 10.10.10.201)
#   ssh_port:       Port SSH publik (e.g. 22201)
#   https_port:     Port HTTPS publik (e.g. 80201)
#   pve_public_ip:  IP publik PVE host (e.g. 192.168.1.102)

- name: Setup port forwarding for challenge VM
  hosts: all
  become: true
  gather_facts: false

  tasks:
    - name: Forward SSH port ({{ ssh_port }} -> {{ vm_ip }}:22)
      ansible.builtin.iptables:
        table: nat
        chain: PREROUTING
        protocol: tcp
        destination: "{{ pve_public_ip }}"
        destination_port: "{{ ssh_port }}"
        jump: DNAT
        to_destination: "{{ vm_ip }}:22"
        comment: "ctf-forward-ssh-{{ vm_ip }}"

    - name: Forward HTTPS port ({{ https_port }} -> {{ vm_ip }}:443)
      ansible.builtin.iptables:
        table: nat
        chain: PREROUTING
        protocol: tcp
        destination: "{{ pve_public_ip }}"
        destination_port: "{{ https_port }}"
        jump: DNAT
        to_destination: "{{ vm_ip }}:443"
        comment: "ctf-forward-https-{{ vm_ip }}"

    - name: Allow FORWARD to VM for SSH
      ansible.builtin.iptables:
        chain: FORWARD
        protocol: tcp
        destination: "{{ vm_ip }}"
        destination_port: "22"
        jump: ACCEPT
        comment: "ctf-allow-ssh-{{ vm_ip }}"

    - name: Allow FORWARD to VM for HTTPS
      ansible.builtin.iptables:
        chain: FORWARD
        protocol: tcp
        destination: "{{ vm_ip }}"
        destination_port: "443"
        jump: ACCEPT
        comment: "ctf-allow-https-{{ vm_ip }}"

    - name: MASQUERADE for internal subnet
      ansible.builtin.iptables:
        table: nat
        chain: POSTROUTING
        source: "{{ vm_ip }}"
        jump: MASQUERADE
        comment: "ctf-masq-{{ vm_ip }}"
