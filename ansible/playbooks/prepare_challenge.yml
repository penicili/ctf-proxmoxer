---
# prepare_challenge.yml
# Build Docker image challenge di CI runner, push ke local registry.
# Jika ada public-images.txt, mirror image publik ke registry juga.
#
# Required extra_vars:
#   source_url:    str  — git repo URL challenge
#   image_tag:     str  — nama image di registry (e.g. "level-1")
#   registry_host: str  — host:port registry (e.g. "10.10.10.5:5000")

- name: Build and push challenge image to registry
  hosts: all
  become: true
  gather_facts: false

  environment:
    PATH: "/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin:/snap/bin"

  vars:
    challenge_dir:    "/opt/challenge-build/{{ image_tag }}"
    full_image:       "{{ registry_host }}/{{ image_tag }}:latest"
    public_images_file: "{{ challenge_dir }}/public-images.txt"

  tasks:
    - name: Ensure build directory is clean
      ansible.builtin.file:
        path: "{{ challenge_dir }}"
        state: absent

    - name: Clone challenge source
      ansible.builtin.git:
        repo:  "{{ source_url }}"
        dest:  "{{ challenge_dir }}"
        depth: 1
        force: yes

    - name: Build Docker image
      ansible.builtin.command:
        cmd:   "docker build -t {{ full_image }} ."
        chdir: "{{ challenge_dir }}"

    - name: Push custom image to registry
      ansible.builtin.command:
        cmd: "docker push {{ full_image }}"

    # Ambil docker-compose.yml dari repo yang sudah di-clone, salin balik ke
    # control node (backend) supaya bisa disimpan ke DB. Saat deploy nanti VM
    # tidak perlu clone repo lagi — cukup inject content ini.
    - name: Cek docker-compose.yml ada
      ansible.builtin.stat:
        path: "{{ challenge_dir }}/docker-compose.yml"
      register: compose_stat

    - name: Fetch docker-compose.yml ke backend (control node)
      ansible.builtin.fetch:
        src:  "{{ challenge_dir }}/docker-compose.yml"
        dest: "/tmp/ctf-compose/{{ image_tag }}.yml"
        flat: yes
      when: compose_stat.stat.exists

    - name: Check if public-images.txt exists
      ansible.builtin.stat:
        path: "{{ public_images_file }}"
      register: public_images_stat

    - name: Read public-images.txt
      ansible.builtin.slurp:
        src: "{{ public_images_file }}"
      register: public_images_content
      when: public_images_stat.stat.exists

    - name: Mirror public images to registry
      ansible.builtin.shell: |
        image="{{ item }}"
        registry_tag="{{ registry_host }}/{{ item }}"
        docker pull "$image"
        docker tag "$image" "$registry_tag"
        docker push "$registry_tag"
      loop: "{{ (public_images_content.content | b64decode).strip().split('\n') | select('match', '.+') | list }}"
      when: public_images_stat.stat.exists

    - name: Clean up build directory
      ansible.builtin.file:
        path: "{{ challenge_dir }}"
        state: absent

    - name: Show result
      ansible.builtin.debug:
        msg: "Image pushed: {{ full_image }}"
